name: "package"

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "release/**"
    paths:
      - "**.dart"
      - "./*.yaml"
      - .github/workflows/_base-dart.yaml
      - .github/workflows/package.yaml
  release:
    types: [published]

# call the base workflow with the package path
jobs:
  dart:
    uses: kerberjg/dart_flutter_ci_experiments/.github/workflows/pipeline.yaml@4224e695167e35d90952e21953b2f933b0f045b0
    strategy:
      matrix:
        package:
          - crystallis
          - crystallis_generator
          - crystallis_plugin
    name: ${{ matrix.package }}
    with:
      path: "packages/${{ matrix.package }}"
      force-sdk: dart
      min-publish-score: 150
