name: "example"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'example/**/*.dart'
      - 'example/**/*.yaml'
      - .github/workflows/_base-dart.yaml
      - .github/workflows/_base-flutter.yaml
      - .github/workflows/example.yaml
  release:
    types: [published]

jobs:
  dart:
    name: "example"
    uses: ./.github/workflows/_base-dart.yaml
    with:
      path: "packages/crystallis/example"
