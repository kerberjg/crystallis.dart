name: "example"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "release/**"
    paths:
      - "packages/**/*.dart"
      - "packages/**/*.yaml"
      - "example/**/*.dart"
      - "example/**/*.yaml"
      - .github/workflows/example.yaml
  release:
    types: [published]

jobs:
  dart:
    name: "example"
    uses: kerberjg/dart_flutter_ci_experiments/.github/workflows/pipeline.yaml@8ad47932f2fb94ccc84ae69f1057bf446454fb0e
    with:
      path: "packages/crystallis/example"
      force-sdk: dart
